<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilancio · Diplomacia</title><link rel="stylesheet" href="unified.css"><link rel="stylesheet" href="bilancio.css"></head><body>
<nav class="unified-nav" aria-label="Sezioni Diplomacia"><a href="index.html">Panoramica</a><a href="province.html">Province</a><a href="fabbriche.html">Fabbriche</a><a href="bilancio.html" aria-current="page">Bilancio provinciale</a><a href="mercato.html">Mercato</a><a href="persone-numeri.html">Persone</a></nav>
<main><header><h1>Bilancio</h1></header>
<section><h2>1. Provincia</h2><div class="pick"><select id="province" aria-label="Provincia"><option value="">Scegli una provincia</option></select><button id="load-province" type="button">Compila dalla provincia</button></div><p id="source" class="muted" role="status"></p><div id="counts" class="fields"></div><div class="fields"><label>Mantenimento giornaliero (%)<input id="rate" type="number" min="0" max="100" step="0.1" value="3"></label><label>Orizzonte (giorni)<input id="days" type="number" min="1" max="3650" step="1" value="30"></label></div></section>
<section><h2>2. Costi e prezzi</h2><div class="table-wrap"><table id="costs"><caption>Costo di un edificio</caption></table></div><div id="prices" class="fields"></div><p id="price-note" class="muted"></p><input id="price-source" type="hidden"></section>
<section><h2>3. Scorte e flussi giornalieri</h2><div class="table-wrap"><table id="finance"><caption>Altre uscite: escluso il mantenimento degli edifici</caption></table></div><button id="zero-flows" type="button" hidden></button></section>
<section><h2>4. Due piani</h2><div id="plans" class="plan-grid"></div></section>
<section id="results" aria-live="polite"><h2>5. Confronto</h2><p id="error" role="alert"></p><div id="summary" class="plan-grid"></div><div class="compare-tabs" id="compare-tabs" aria-label="Mostra"></div><div class="table-wrap"><table id="compare"></table></div></section>
<section class="save-row"><button id="save" type="button">Salva</button> <button id="restore" type="button">Ripristina</button><span id="save-status" role="status"></span></section>
</main><script src="sito.js"></script><script type="module" src="bilancio.js"></script></body></html>
